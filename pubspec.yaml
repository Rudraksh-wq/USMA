name: usma
description: Unified Scholarship Mobile Application — single view for MoTA ST scholarships.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4
  firebase_crashlytics: ^4.0.4
  firebase_analytics: ^11.2.1
  cloud_functions: ^5.0.4
  connectivity_plus: ^6.0.3
  intl: ^0.20.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2
  file_picker: ^8.0.6
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  uuid: ^4.4.0
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

dependency_overrides:
  path_provider_android: 2.2.17

flutter:
  uses-material-design: true
  assets:
    - assets/faq/faq.json
    - assets/data/schemes.json
    - assets/data/demo_personas.json
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf
    - family: NotoSansOriya
      fonts:
        - asset: assets/fonts/NotoSansOriya.ttf
